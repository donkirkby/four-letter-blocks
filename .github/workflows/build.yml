# This workflow will install Python dependencies and run tests with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: build

on:
  - push
  - pull_request

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.33"
          enable-cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y -q \
            freeglut3-dev \
            gdebi \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            xserver-xephyr \
            xvfb
          wget -O qxw.deb https://www.quinapalus.com/qxw_20200708-1_amd64.deb
          sudo gdebi qxw.deb
          uv sync --locked --dev
          uv pip install coverage # Extra copy for codecov upload.
      - name: Scan with mypy
        run: |
          uv run mypy four_letter_blocks
      - name: Test with pytest
        id: test
        run: |
          # Add QT_DEBUG_PLUGINS=1 before xvfb-run to debug Qt library problems.
          xvfb-run -a uv run python -m coverage run --source=four_letter_blocks -m pytest
      - name: Upload code coverage
        run: |
          uv pip install codecov
          uv run codecov
      - name: Upload image diffs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ always() && steps.test.outcome == 'failure' }}
        with:
          name: image-diffs
          path: |
            tests/pixmap_diffs/*.png
            tests/pixmap_diffs/*.svg
